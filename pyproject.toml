[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "picblocks"
version = "2.1.0"
description = "A library for code similarity estimation using PIC hashing over basic blocks."
readme = "README.md"
# The floor the MCRIT ecosystem shares. Without one, pip quietly resolves an older smda on an
# older Python instead of saying the Python is too old.
requires-python = ">=3.12"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Daniel Plohmann", email = "daniel.plohmann@mailbox.org" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "smda>=4.2.13",
]

[project.urls]
Homepage = "https://github.com/danielplohmann/picblocks"
Repository = "https://github.com/danielplohmann/picblocks"
Issues = "https://github.com/danielplohmann/picblocks/issues"
Changelog = "https://github.com/danielplohmann/picblocks/blob/master/CHANGELOG.md"

[project.optional-dependencies]
web = [
    "flask",
    "werkzeug",
    "waitress",
    "pymongo",
    "tqdm",
]
dev = [
    "build",
    "pytest",
    "requests",
    "ruff",
    "twine",
    "ty",
]

# the demo app, its utils and the tests live next to the package and are not part of it
[tool.setuptools.packages.find]
include = ["picblocks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_mcrit: needs a running mcrit server and SMDA xored fixtures",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ty.rules]
unresolved-import = "ignore"
